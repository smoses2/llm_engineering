[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-evals"
version = "0.1.0"
description = "Bedrock RAG evaluation framework"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "Jinja2>=3.1,<4",
    "typer>=0.12,<1",
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1",
    "types-PyYAML>=6",
]

[project.scripts]
rag-evals = "rag_evals.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_evals = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["rag_evals"]

[[tool.mypy.overrides]]
module = "bd_api.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
