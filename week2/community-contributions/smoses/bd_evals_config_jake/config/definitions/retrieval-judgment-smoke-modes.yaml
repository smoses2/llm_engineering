# Judges the standard-vs-rerank retrieval dataset with the unchanged clinical_v3 prompts.
#
# Calls = source artifacts x judge models x prompt variants x inference variants
#       = 30 x 1 x 1 x 1 = 30 calls.
#
# The judge remains blind to retrieval mode: the template allowlist excludes it, so
# standard and rerank rows are scored identically and separated only in the report.
schema_version: 1
test:
  id: retrieval-judgment-smoke-modes
  type: retrieval_judgment
source_dataset:
  type: retrieval
  id: retrieval-smoke-002
judge_models:
  source: ../judge-models.yaml
selection:
  judge_models:
    include: [claude_haiku_4_5]
prompt_variants:
  - id: clinical_v3
    template:
      system_instructions: prompts/retrieval-judge/system.md
      user_message: prompts/retrieval-judge/user.md
inference_variants:
  - id: deterministic
    inference_config:
      maxTokens: 2048
      temperature: 0
api:
  base_url_env: BD_API_BASE_URL
  api_key_env: BD_API_KEY
output:
  dataset_id: retrieval-judgment-smoke-004
execution:
  concurrency: 5
  continue_on_error: true
  retries:
    maximum_attempts: 3
