# Report over the standard-vs-rerank dataset. Makes zero API calls.
#
# Pivot the CSV on retrieval_mode to compare modes, and check effective_mode and
# retrieval_fallback before trusting any rerank conclusion.
datasets:
  retrieval: retrieval-smoke-002
  retrieval_judgments: retrieval-judgment-smoke-004
output_dir: smoke-modes
scoring:
  retrieval_judgment:
    parser: json
    minimum: 1
    maximum: 5
    criteria:
      - context_integrity
      - signal_density
      - answerability
      - clinical_completeness
      - medical_safety
    comment_field: comments
    source_assessment_field: source_assessments
