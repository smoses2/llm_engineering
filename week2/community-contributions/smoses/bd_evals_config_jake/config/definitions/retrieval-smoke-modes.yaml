# Smoke retrieval, standard vs rerank on the same questions and knowledge bases.
#
# Matrix = questions x knowledge_bases x modes x candidate_counts x result_counts
#        = 3 x 5 x 2 x 1 x 1 = 30 calls.
#
# Both modes live in one dataset so the report can pivot on retrieval_mode as a
# paired comparison. Watch effective_mode and retrieval_fallback in the report: if
# reranking silently falls back to standard, the comparison is standard versus
# standard and any conclusion about reranking is void.
schema_version: 1
test:
  id: retrieval-smoke-modes
  type: retrieval
questions:
  source: ../questions.yaml
knowledge_bases:
  source: ../knowledge-bases.yaml
selection:
  questions:
    include: [q001, q002, q003]
  knowledge_bases:
    include: [kb_fixed_500, kb_fixed_1024, kb_semantic_512, kb_semantic_1024, kb_none]
retrieval:
  modes: [standard, rerank]
  candidate_counts: [20]
  result_counts: [5]
deployment:
  label: merge-disabled
  merge:
    enabled: false
    maximum_chunks_per_document: null
api:
  base_url_env: BD_API_BASE_URL
  api_key_env: BD_API_KEY
output:
  dataset_id: retrieval-smoke-002
execution:
  concurrency: 5
  continue_on_error: true
  retries:
    maximum_attempts: 3
