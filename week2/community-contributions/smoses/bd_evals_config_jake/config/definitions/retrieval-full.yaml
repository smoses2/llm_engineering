# Smoke retrieval run: prove the pipeline end to end at minimal cost.
# Matrix = questions x knowledge_bases x modes x candidate_counts x result_counts
#        = 3 x 5 x 1 x 1 x 1 = 15 calls.
schema_version: 1
test:
  id: retrieval-full
  type: retrieval
questions:
  source: ../questions.yaml
knowledge_bases:
  source: ../knowledge-bases.yaml
selection:
  questions:
    include: [q001, q002, q003, q004, q005, q006, q007, q008, q009, q010, q011, q012, q013, q014, q015, q016, q017, q018, q019, q020, q021, q022, q023, q024, q025, q026, q027, q028, q029, q030, q031, q032, q033, q034, q035, q036, q037, q038, q039, q040, q041, q042, q043, q044, q045, q046, q047, q048, q049, q050, q051, q052, q053, q054, q055, q056, q057, q058, q059, q060, q061, q062, q063, q064, q065, q066, q067, q068, q069, q070, q071, q072, q073, q074, q075, q076, q077, q078, q079, q080, q081, q082, q083, q084, q085, q086, q087, q088, q089, q090, q091]
  knowledge_bases:
    include: [kb_fixed_500, kb_fixed_1024, kb_semantic_512, kb_semantic_1024, kb_none]
retrieval:
  modes: [standard, rerank]
  candidate_counts: [20]
  result_counts: [5]
deployment:
  label: merge-disabled
  merge:
    enabled: false
    maximum_chunks_per_document: null
api:
  base_url_env: BD_API_BASE_URL
  api_key_env: BD_API_KEY
output:
  dataset_id: retrieval-full-001
execution:
  concurrency: 5
  continue_on_error: true
  retries:
    maximum_attempts: 3
